<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f3b5c"/>
      <stop offset="1" stop-color="#0d1f33"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="1" stop-color="#0097a7"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- road perspective lines -->
  <path d="M30 120 L56 70 M98 120 L72 70" stroke="#3d5a80" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M64 112 L64 100 M64 92 L64 84" stroke="#8fb3d9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- sign post -->
  <rect x="44" y="58" width="6" height="46" rx="3" fill="#b0bec5"/>
  <!-- diamond warning sign -->
  <g transform="rotate(45 47 38)">
    <rect x="28" y="19" width="38" height="38" rx="6" fill="url(#sign)" stroke="#263238" stroke-width="3"/>
    <rect x="33" y="24" width="28" height="28" rx="3" fill="none" stroke="#263238" stroke-width="1.6"/>
  </g>
  <!-- curve arrow on the sign -->
  <path d="M41 49 L41 40 Q41 32 49 32 L51 32" fill="none" stroke="#263238" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M49 27.5 L55 32 L49 36.5 Z" fill="#263238"/>
  <!-- location pin -->
  <g transform="translate(84 58)">
    <path d="M0 -26 C-14 -26 -22 -16 -22 -5 C-22 9 0 30 0 30 C0 30 22 9 22 -5 C22 -16 14 -26 0 -26 Z"
          fill="url(#pin)" stroke="#e0f7fa" stroke-width="2.5"/>
    <circle cx="0" cy="-5" r="8" fill="#e0f7fa"/>
    <circle cx="0" cy="-5" r="3.5" fill="#00838f"/>
  </g>
</svg>
